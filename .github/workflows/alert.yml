name: THSR Seat Alert

# One-off check / test email (used by the web console buttons).
# Continuous monitoring is handled by monitor.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 立即檢查一次；test-email = 寄測試信；debug-seats = 印出原始座位資料"
        type: choice
        options: [run, test-email, debug-seats]
        default: run
      date:
        description: "debug-seats 用：日期 YYYY-MM-DD"
        required: false
      from:
        description: "debug-seats 用：起站"
        required: false
        default: "台北"
      to:
        description: "debug-seats 用：迄站"
        required: false
        default: "台中"

concurrency:
  group: thsr-seat-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check seats & send email
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          if [ "$MODE" = "debug-seats" ]; then
            python -m thsr_alert seats --from "${{ github.event.inputs.from || '台北' }}" --to "${{ github.event.inputs.to || '台中' }}" --date "${{ github.event.inputs.date }}"
          elif [ "$MODE" = "test-email" ]; then
            python -m thsr_alert test-email
          else
            source scripts/common.sh && check_once
          fi
