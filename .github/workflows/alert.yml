name: THSR Seat Alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
  push:
    paths: ["config.yaml", "holidays.yaml", "thsr_alert/**"]

concurrency:
  group: thsr-seat-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: thsr-state-${{ github.run_id }}
          restore-keys: thsr-state-

      - name: Check seats & send email
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m thsr_alert run

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: thsr-state-${{ github.run_id }}-${{ github.run_attempt }}
