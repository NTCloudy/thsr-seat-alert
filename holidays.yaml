# ============================================================
#  節日／連假日期表（依行政院人事行政總處公告）
#  116 年（2027）政府行政機關辦公日曆表：https://www.dgpa.gov.tw/
#
#  start / end : 連假第一天／最後一天（含）
#  sale_open   : （選填）高鐵如果對這個連假「提前加開疏運」或另外公告開賣時間，
#                就填在這裡，會蓋掉預設的「乘車日前 28 天」規則
#                例：sale_open: "2027-01-05 00:00"
# ============================================================
holidays:
