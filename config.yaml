# 高鐵空位監控設定檔（由網頁控制台產生：https://ntcloudy.github.io/thsr-seat-alert/）
# date: start-1=連假前一天、start=第一天、end=收假那天、end+1=收假後第一天｜car: standard/business/any
# done: 已搶到的車程（不再提醒）｜remind_before_sale: d=天 h=小時 m=分鐘
settings:
  sale_open_days_before: 27
  sale_open_time: "00:00"
  remind_before_sale:
    - "6h"
  notify_when_sale_opens: false
default_legs:
  - label: "回台中"
    date: "start-1"
    from: "台北"
    to: "台中"
    depart_after: "19:30"
    depart_before: "20:30"
    car: "standard"
  - label: "回台北"
    date: "end"
    from: "台中"
    to: "台北"
    depart_after: "15:00"
    depart_before: "17:00"
    car: "standard"
trips:
  - name: "2026 選舉投票"
    holiday: "2026選舉投票日"
    enabled: false
    done: []
  - name: "2027 春節"
    holiday: "2027春節"
    enabled: true
    done: []
  - name: "2027 清明連假"
    holiday: "2027兒童節清明節"
    enabled: true
    done: []
  - name: "2027 國慶連假"
    holiday: "2027國慶日"
    enabled: true
    done: []
  - name: "2027 光復節連假"
    holiday: "2027臺灣光復節"
    enabled: true
    done: []
